aid: nisos
name: Nisos
description: >-
  Nisos is a human risk intelligence company, founded in 2015 and headquartered in
  Alexandria, Virginia, that combines analyst-led investigative tradecraft with an
  AI-assisted platform to help enterprises detect, investigate and mitigate threats that
  originate with people. Its Managed Intelligence services cover executive protection and
  digital exposure, employment and hiring fraud, insider threat, third-party and supply-chain
  intelligence, threat landscape assessment, OSINT monitoring and adversary attribution
  investigations, drawing on surface, deep and dark web collection. Its Ascend platform
  productizes that tradecraft for client-led use, shipping Executive Shield and Insider
  Threat Intelligence modules with continuous monitoring, PII removal, risk analytics and
  dashboard reporting. Nisos sells enterprise-only through a demo request; it publishes no
  developer portal, no API reference and no machine-readable contract, though the Ascend
  console does call a live, credential-gated external API host of its own.
