apis:
- aid: nisos:nisos-ascend-external-api
  name: Nisos Ascend External API
  description: >-
    Credential-gated HTTPS API behind the Nisos Ascend human risk management platform. Its
    existence and base URL are established from Nisos's own production build: the Ascend
    console's configuration module (ascend.nisos.com/assets/api-urls-*.js) declares
    EXTERNAL_API_URL as https://api.ascend.nisos.com and API_URL as
    https://platform.ascend.nisos.com. The external host is an AWS API Gateway that answers
    every anonymous request — root, control path and /.well-known/* alike — with HTTP 403
    {"message":"Forbidden"} and x-amzn-errortype ForbiddenException. Nisos publishes no
    reference, no OpenAPI and no authentication documentation for it, so no operations,
    parameters or auth scheme are recorded here. Listed as a measured, gated surface.
  humanURL: https://nisos.com/platform/ascend/
  baseURL: https://api.ascend.nisos.com
  tags:
